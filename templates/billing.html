<!DOCTYPE html>
<html>
<head>
    <title>Billing Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">
        <h1>💰 Billing Management</h1>
    </div>
</header>

<div class="container">

<h2>Generate New Bill</h2>

<form action="/add_bill" method="POST">

<label><b>Bill Number</b></label>
<input type="text" value="Auto Generate" readonly>

<label><b>Customer Name</b></label>
<input type="text" name="customer_name" required>

<label><b>Amount (₹)</b></label>
<input type="number" id="amount" name="amount" placeholder="Enter Amount" onkeyup="calculateTotal()" required>

<label><b>GST (%)</b></label>
<input type="number" id="gst" name="gst" value="18" onkeyup="calculateTotal()" required>

<label><b>Total Amount (₹)</b></label>
<input type="number" id="total" name="total" readonly>

<br><br>

<button type="submit">💾 Generate Bill</button>

</form>

<hr style="margin:30px 0;">

<h2>Billing List</h2>

<table>

<tr>
    <th>ID</th>
    <th>Bill No</th>
    <th>Customer</th>
    <th>Amount</th>
    <th>GST</th>
    <th>Total</th>
    <th>Action</th>
</tr>

{% for b in bills %}

<tr>

    <td>{{ b[0] }}</td>
    <td>{{ b[1] }}</td>
    <td>{{ b[2] }}</td>
    <td>₹ {{ b[3] }}</td>
    <td>{{ b[4] }}%</td>
    <td>₹ {{ b[5] }}</td>

    <td>

        <a href="/edit_bill/{{ b[0] }}">
            <button type="button">✏ Edit</button>
        </a>

        <a href="/delete_bill/{{ b[0] }}">
            <button type="button">🗑 Delete</button>
        </a>

        <a href="/print_bill/{{ b[0] }}">
            <button type="button">🖨 Print</button>
        </a>

    </td>

</tr>

{% endfor %}

</table>

<br><br>

<center>
<a href="/dashboard">
<button type="button">⬅ Back Dashboard</button>
</a>
</center>

</div>

<script>
function calculateTotal() {
    var amount = parseFloat(document.getElementById("amount").value) || 0;
    var gst = parseFloat(document.getElementById("gst").value) || 0;

    var total = amount + (amount * gst / 100);

    document.getElementById("total").value = total.toFixed(2);
}
</script>

</body>
</html>
