<!DOCTYPE html>
<html>
<head>
    <title>Customer Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">

    <div class="header-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">
        <h1>👤 Customer Management</h1>
    </div>

</header>

<div class="container">

<h2>Add New Customer</h2>

<form action="/add_customer" method="POST">

<label><b>Customer Name</b></label>
<input type="text" name="name" placeholder="Enter Customer Name" required>

<label><b>Mobile Number</b></label>
<input type="text" name="mobile" placeholder="Enter Mobile Number" required>

<label><b>Email</b></label>
<input type="email" name="email" placeholder="Enter Email" required>

<label><b>Address</b></label>
<textarea name="address" rows="3" placeholder="Enter Address"></textarea>

<label><b>Solar Panel Type</b></label>

<select name="panel">
    <option>Monocrystalline</option>
    <option>Polycrystalline</option>
    <option>Thin Film</option>
</select>

<br><br>

<button type="submit">💾 Save Customer</button>

</form>

<hr style="margin:30px 0;">

<form method="GET" action="/customer" style="margin-bottom:20px;">

<input
    type="text"
    name="search"
    placeholder="🔍 Search Customer by Name"
    style="width:70%;">

<button type="submit">Search</button>

</form>

<h2>Customer List</h2>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Mobile</th>
    <th>Email</th>
    <th>Address</th>
    <th>Panel</th>
    <th>Action</th>
</tr>

{% for c in customers %}

<tr>

<td>{{ c[0] }}</td>
<td>{{ c[1] }}</td>
<td>{{ c[2] }}</td>
<td>{{ c[3] }}</td>
<td>{{ c[4] }}</td>
<td>{{ c[5] }}</td>

<td>

<a href="/edit_customer/{{ c[0] }}">
    <button type="button">✏ Edit</button>
</a>

<a href="/delete_customer/{{ c[0] }}"
   onclick="return confirm('Delete this customer?')">
    <button type="button" class="logout">🗑 Delete</button>
</a>

</td>

</tr>

{% endfor %}

</table>

<br><br>

<center>
<a href="/dashboard">
    <button type="button">⬅ Back Dashboard</button>
</a>
</center>

</div>

</body>
</html>
