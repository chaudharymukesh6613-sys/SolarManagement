<!DOCTYPE html>
<html>
<head>
    <title>Edit Bill</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">
        <h1>💰 Edit Bill</h1>
    </div>
</header>

<div class="container">

<h2>Update Bill</h2>

<form action="/update_bill/{{ bill[0] }}" method="POST">

<label>Bill Number</label>
<input type="text" name="bill_no" value="{{ bill[1] }}" required>

<label>Customer Name</label>
<input type="text" name="customer_name" value="{{ bill[2] }}" required>

<label>Amount</label>
<input type="number" name="amount" value="{{ bill[3] }}" required>

<label>GST (%)</label>
<input type="number" name="gst" value="{{ bill[4] }}" required>

<label>Total Amount</label>
<input type="number" name="total" value="{{ bill[5] }}" required>

<br><br>

<button type="submit">💾 Update Bill</button>

</form>

<br>

<a href="/billing">
    <button type="button">⬅ Back</button>
</a>

</div>

</body>
</html>
